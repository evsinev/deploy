version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # micrometer 1.13+ moved io.micrometer.prometheus.* to io.micrometer.prometheusmetrics.* (see CLAUDE.md)
      - dependency-name: "io.micrometer:*"
        versions: [">= 1.13.0"]
    groups:
      maven-minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
